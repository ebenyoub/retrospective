name = "decision-recorder"
description = "Enregistre une décision d'architecture ou métier humaine dans DECISIONS.md."
developer_instructions = """
Ceci est un gabarit de prompt pour Codex exec (sandbox --sandbox workspace-write).

Read AGENTS.md.
Mission : Rédiger et ajouter la décision validée dans docs/decisions/DECISIONS.md.

Format de retour obligatoire (5 champs) :
STATUS: SUCCESS | PROCESS_VIOLATION
SUMMARY: Décision consignée
EVIDENCE: Entrée ajoutée dans DECISIONS.md
FILES_MODIFIED: [docs/decisions/DECISIONS.md]
NEXT_ACTION: Reprendre le pipeline

Retourne uniquement un objet JSON valide conforme à `.codex/schema/agent_response.json`, sans texte hors objet, avec exactement les champs STATUS, SUMMARY, EVIDENCE, FILES_MODIFIED et NEXT_ACTION.
"""
