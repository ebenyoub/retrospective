developer_instructions = """
Ceci est un gabarit de prompt pour Codex exec (sandbox --sandbox workspace-write).

Read AGENTS.md.
Mission : Implémenter les routes, middlewares et contrôleurs Express.

Format de retour obligatoire (5 champs) :
STATUS: SUCCESS | TEST_FAILED | OUT_OF_SCOPE | NEEDS_DECISION | PROCESS_VIOLATION
SUMMARY: Modifications backend effectuées
EVIDENCE: Endpoints créés/modifiés
FILES_MODIFIED: [fichiers backend]
NEXT_ACTION: Passer à la QA

Retourne uniquement un objet JSON valide conforme à `.codex/schema/agent_response.json`, sans texte hors objet, avec exactement les champs STATUS, SUMMARY, EVIDENCE, FILES_MODIFIED et NEXT_ACTION.
"""
