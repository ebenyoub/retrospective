# Bloc nginx du projet retrospective, à ajouter tel quel à la suite des blocs
# existants dans /srv/infrastructure/nginx/conf.d/main.conf (VPS partagé,
# 167.233.194.26). Ne pas créer/modifier ce fichier partagé depuis un dépôt
# projet : ce fichier documente uniquement le contenu à y coller lors du
# déploiement, avec sauvegarde préalable de main.conf (conf.d/backups/).
#
# Voir docs/technical/DEPLOYMENT.md pour le contexte (routage par chemin,
# même sous-domaine pour frontend/backend, en-têtes WebSocket pour Socket.IO).

server {
    listen 80;
    server_name retrospective.elyasbenyoub.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name retrospective.elyasbenyoub.dev;

    ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    resolver 127.0.0.11 valid=10s;

    location /socket.io/ {
        set $retrospective_backend http://retrospective-backend-1:8000;
        proxy_pass $retrospective_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Préfixe unique pour toute l'API (avant : /auth/ et /session/ séparés).
    # /session/ collisionnait avec la route SPA /session/:id du frontend : nginx
    # routait aussi les vraies navigations navigateur vers le backend, qui
    # renvoyait du JSON brut au lieu de l'app React (bug BUG-SESSION-RELOAD-
    # ROUTING-01, reproduit au F5 sur une page de session). /api/ lève
    # l'ambiguïté définitivement, aucune route frontend ne commence par /api.
    location /api/ {
        set $retrospective_backend http://retrospective-backend-1:8000;
        proxy_pass $retrospective_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $retrospective_frontend http://retrospective-frontend-1:80;
        proxy_pass $retrospective_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
