name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend:
    name: Frontend - tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retrospective_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retrospective_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test

  e2e:
    name: Frontend - E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retrospective_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Toutes les specs e2e/*.spec.ts mockent leurs appels API via
      # page.route() : aucun backend/DB réel nécessaire, playwright.config.ts
      # démarre lui-même le serveur de dev frontend (webServer).
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: retrospective_frontend/playwright-report/
          retention-days: 7
