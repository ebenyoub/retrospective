name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend:
    name: Frontend - tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retrospective_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retrospective_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test
